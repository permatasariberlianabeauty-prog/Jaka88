##
## NOXARA - Nginx Configuration
## Simpan di: /etc/nginx/sites-available/noxara.conf
## Lalu: ln -s /etc/nginx/sites-available/noxara.conf /etc/nginx/sites-enabled/
## Restart: systemctl restart nginx
##

server {
    listen 80;
    listen [::]:80;
    server_name noxara.com www.noxara.com;

    # Redirect HTTP ke HTTPS (aktifkan setelah pasang SSL)
    # return 301 https://$server_name$request_uri;

    root /var/www/html/noxara;
    index index.php index.html;

    # ─── Charset & Gzip ──────────────────────────────────────
    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # ─── Upload Size ──────────────────────────────────────────
    client_max_body_size 12M;

    # ─── Security Headers ────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Block Sensitive Paths ───────────────────────────────
    location ~ ^/(config|includes|cron|logs|database)/ {
        deny all;
        return 403;
    }

    # ─── Block Sensitive Files ───────────────────────────────
    location ~ \.(sql|log|env|git|htpasswd|bak|backup)$ {
        deny all;
        return 403;
    }

    # ─── Static Assets Cache ─────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|webp|ico|svg|woff|woff2|ttf|css|js)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── Main PHP Routing ────────────────────────────────────
    location / {
        try_files $uri $uri/ @php_router;
    }

    location @php_router {
        rewrite ^/login/?$              /auth/login.php last;
        rewrite ^/register/?$           /auth/register.php last;
        rewrite ^/logout/?$             /auth/logout.php last;
        rewrite ^/forgot-password/?$    /auth/forgot_password.php last;
        rewrite ^/reset-password/?$     /auth/reset_password.php last;

        rewrite ^/dashboard/?$          /pages/dashboard.php last;
        rewrite ^/deposit/?$            /pages/deposit.php last;
        rewrite ^/withdraw/?$           /pages/withdraw.php last;
        rewrite ^/products/?$           /pages/products.php last;
        rewrite ^/products/([^/]+)/?$   /pages/products.php?slug=$1 last;
        rewrite ^/my-packages/?$        /pages/my_packages.php last;
        rewrite ^/referral/?$           /pages/referral.php last;
        rewrite ^/history/?$            /pages/history.php last;
        rewrite ^/ads/?$                /pages/ads.php last;
        rewrite ^/daily-reward/?$       /pages/daily_reward.php last;
        rewrite ^/missions/?$           /pages/missions.php last;
        rewrite ^/leaderboard/?$        /pages/leaderboard.php last;
        rewrite ^/profit-calendar/?$    /pages/profit_calendar.php last;
        rewrite ^/notifications/?$      /pages/notifications.php last;
        rewrite ^/chat/?$               /pages/chat.php last;
        rewrite ^/vip/?$                /pages/vip.php last;
        rewrite ^/voucher/?$            /pages/voucher.php last;
        rewrite ^/profile/?$            /pages/profile.php last;
        rewrite ^/security/?$           /pages/security.php last;
        rewrite ^/bank-accounts/?$      /pages/bank_account.php last;
        rewrite ^/faq/?$                /pages/faq.php last;
        rewrite ^/info/?$               /pages/info.php last;
        rewrite ^/contact/?$            /pages/contact.php last;

        rewrite ^/admin/?$              /admin/index.php last;
        rewrite ^/admin/login/?$        /admin/login.php last;
        rewrite ^/admin/(.+)/?$         /admin/$1.php last;

        rewrite ^/api/(.+)/?$           /api/$1.php last;
    }

    # ─── PHP-FPM ─────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize=10M \n post_max_size=12M \n max_execution_time=60 \n memory_limit=256M";
        fastcgi_read_timeout 60;
    }

    # ─── Error Pages ─────────────────────────────────────────
    error_page 404 /errors/404.php;
    error_page 500 /errors/500.php;
    error_page 403 /errors/403.php;

    # ─── Logs ────────────────────────────────────────────────
    access_log /var/log/nginx/noxara_access.log;
    error_log  /var/log/nginx/noxara_error.log;
}

